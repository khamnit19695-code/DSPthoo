name: Build Mix Digital DSP APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          unzip -o MixDigitalDSP_Fixed.zip -d extracted

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle | head -n 1)
          DIR=$(dirname "$PROJECT")
          gradle --no-daemon -p "$DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MixDigitalDSP-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
